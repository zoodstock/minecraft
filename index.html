<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>마인크래프트 알파</title>
    <link rel="stylesheet" href="css/style.css?v=11">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <!-- 십자선 -->
    <div id="crosshair"></div>

    <!-- 정보 -->
    <div id="info" style="display:none;">
        <div id="fps">FPS: 0</div>
        <div id="coords">X: 0 Y: 0 Z: 0</div>
        <div id="fly-status">걷기</div>
        <div id="player-count"></div>
    </div>

    <!-- 명령어 버튼 바 -->
    <div id="cmd-bar" style="display:none;">
        <button class="cmd-btn" data-cmd="/summon clione">클리오네</button>
        <button class="cmd-btn" data-cmd="/summon maja">마하</button>
        <button class="cmd-btn" data-cmd="/summon bloop">블룹</button>
        <button class="cmd-btn" data-cmd="/summon meowl">미아울</button>
        <button class="cmd-btn" data-cmd="/summon ghast">가스트</button>
        <button class="cmd-btn" data-cmd="/summon guardian">가디언</button>
        <button class="cmd-btn" data-cmd="/summon wither">위더</button>
        <button class="cmd-btn" data-cmd="/summon enderdragon">드래곤</button>
        <button class="cmd-btn" data-cmd="/summon dragon_egg">드래곤알</button>
        <button class="cmd-btn" data-cmd="/summon babydragon">아기드래곤</button>
        <button class="cmd-btn" data-cmd="/summon leviathan_egg">래비아탄알</button>
        <button class="cmd-btn" data-cmd="/summon leviathan">래비아탄</button>
        <button class="cmd-btn cmd-red" data-cmd="/kill">처치</button>
    </div>

    <!-- 선택된 블록 이름 -->
    <div id="selected-block" style="display:none;">잔디</div>

    <!-- 핫바 -->
    <div id="hud" style="display:none;"></div>

    <!-- 시작 화면 -->
    <div id="start-screen">
        <h1>마인크래프트</h1>
        <p>알파 에디션 - 크리에이티브 모드</p>

        <!-- 멀티플레이어 옵션 -->
        <div class="mp-section">
            <button class="start-btn" id="start-solo">혼자 플레이</button>
        </div>
        <div class="mp-section">
            <button class="start-btn mp-btn" id="start-host">방 만들기</button>
            <div id="room-info" style="display:none;">
                <div class="room-code-label">방 코드:</div>
                <div id="room-code" class="room-code"></div>
                <button class="copy-btn" id="copy-code">복사</button>
                <div id="host-status">접속 대기 중...</div>
                <button class="start-btn" id="start-host-game" style="display:none;">게임 시작</button>
            </div>
        </div>
        <div class="mp-section">
            <button class="start-btn mp-btn" id="start-join">방 참가하기</button>
            <div id="join-section" style="display:none;">
                <input type="text" id="join-code" placeholder="방 코드 입력" class="code-input">
                <button class="start-btn" id="join-btn">접속</button>
                <div id="join-status"></div>
            </div>
        </div>

        <div class="controls-info">
            <strong>PC:</strong> WASD - 이동 | 마우스 - 시점 | Space×2 - 비행 전환<br>
            짧게 클릭 - 부수기 | 길게 클릭 - 설치 | 우클릭 - 설치<br>
            비행 중: Space - 상승 | Shift - 하강<br><br>
            <strong>모바일:</strong> 왼쪽 스틱 - 이동 | 오른쪽 스틱 - 시점<br>
            부수기/설치 버튼 | 점프×2 - 비행 전환
        </div>
    </div>

    <!-- 모바일 조이스틱 -->
    <div class="joystick-container" id="joystick-move">
        <div class="joystick-inner"></div>
        <div class="joystick-label">이동</div>
    </div>
    <div class="joystick-container" id="joystick-look">
        <div class="joystick-inner"></div>
        <div class="joystick-label">시점</div>
    </div>

    <!-- 모바일 액션 버튼 -->
    <div class="mobile-buttons">
        <button class="action-btn" id="btn-break">부수기</button>
        <button class="action-btn" id="btn-place">설치</button>
        <button class="action-btn" id="btn-descend">하강</button>
    </div>
    <button class="action-btn" id="btn-jump">점프</button>

    <!-- 명령어 입력 -->
    <input type="text" id="chat-input" placeholder="/summon clione" autocomplete="off" style="display:none;">
    <div id="chat-msg" style="display:none;"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>
    <script type="module" src="js/main.js?v=24"></script>
</body>
</html>
